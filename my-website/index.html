<!doctype html>
<html lang="en-US">
  <head>

    <link href="./src/style.css" rel="stylesheet" />

    <div id="content-wrapper">
      <div id="content">
        <div id="title" style="grid-row: 1; grid-column: 2;">
          <h1 id="title-el">No Tutorial</h1>
          <h4 id="subtitle">This webside is made no tutorials.</h4>

          <img src="/gretel.png" />

        <div class="image-wrapper grid-element" style="grid-row: 3; grid-column: 3;">

    </div>
    <script type="module" src="./src/main.js"></script>
